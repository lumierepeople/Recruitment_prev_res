  }
}

* { box-sizing: border-box; }

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
.wrap { max-width: 920px; margin: 0 auto; }
a { color: var(--accent); text-underline-offset: 3px; }

header { padding-top: 36px; padding-bottom: 20px; }

.tl > div::before { content: ""; position: absolute; left: -25px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

.decision { border-left: 3px solid var(--warm); }
.warnbox { background: var(--warm-soft); border-radius: 12px; padding: 16px 18px; }

.warnbox ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
footer { color: var(--muted); font-size: 13px; padding-top: 32px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

ist": "Дорослі часто говорять про ваше покоління, але рідко питають, що ви самі думаєте. Анонімне опитування, жодних правильних чи неправильних відповідей. Для підлітків окремий опитувальник."}, {"name": "На роздоріжжі", "who": "Юнаки й юнки 18–25", "gist": "Покоління виросло під час війни й зараз вирішує, що з цим робити. Просять відповісти чесно, навіть якщо людина намагається про це не думати."}, {"name": "Перед вибором", "who": "Чоловіки 25+, які обирають підрозділ", "gist": "На п'ятому році війни питання вже не лише в тому, чи долучатися, а й до кого саме. Що впливає на вибір: люди, командири, репутація, досвід інших."}, {"name": "У строю", "who": "Діючі військові, що шукають іншу бригаду для переведення", "gist": "Люди вже служать, але відчувають, що можна робити це краще в іншому місці. Хочемо зрозуміти, як вони шукають кращий варіант і знаходять."}, {"name": "Власна логіка", "who": "Ті, що ухиляються від мобілізації", "gist": "Про причини не йти говорять переважно за них. Ми хочемо почути від самих людей. Не переконуємо, а розуміємо, як вони дійшли рішення."}, {"name": "Свідомий крок (в чернетці: «Її рішення» / «Я так вирішила»)", "who": "Жінки у війську", "gist": "Про чоловіків у війську говорять багато, про жінок майже ні. Жінка обирала, куди, до кого й на яких умовах. Питаємо, що було критично важливим."}, {"name": "Переосмислення шляху", "who": "Ветерани, що думають повернутися до служби й обирають бригаду", "gist": "У чернетках сторіс цієї точки немає окремим текстом."}, {"name": "Почати заново", "who": "СЗЧ, які шукають, у яку бригаду повернутися", "gist": "Людина має досвід служби, з різних причин залишила військо й думає повернутися, але в іншу бригаду. Хочемо зрозуміти, що допоможе повернутися усвідомлено."}], "frame": "Рішення долучитися до війська не народжується за один день. Припущення дослідження: у рішення є власний шлях, від ставлення до війни до вибору бригади чи переосмислення досвіду. LUMIERE TECH як волонтерська спільнота запускає власне дослідження цього шляху."}, "decisions": [{"date": "7 липня 2026", "who": "Olga Fall", "text": "Концепт сподобався. Для жінок потрібна інша назва, яка підкреслює, що це свідомий крок. Щодо ухилянтів варто навести трохи інше світло: у їхніх головах варіанти є, раз вони досі не воюють. Запропонувала допрацювати текст по ухилянтах."}, {"date": "14 липня 2026", "who": "акаунт Lumiere Tech", "text": "У текст для ухилянтів внести правки, щоб він не схиляв до рекрутингу. Важливо навпаки вислухати, чому ні, щоб опрацьовувати ці заперечення."}, {"date": "14 липня 2026", "who": "акаунт Lumiere Tech", "text": "Сторітел спершу дати Софії скоротити, бо текст завеликий. Потім у дизайн. Форму перевірити ще раз перед запуском з Пташкою."}, {"date": "4 серпня 2026", "who": "Саша", "text": "Ксеня попросила крім сторіс зробити картинку для репосту опитування в телеграм-канали. Потрібен текст або технічне завдання."}], "reconcile": ["У Trello шість сегментів: 1.1, 1.2, 2 (до 25), 3 (підлітки), 4 (ухилянти), 5 (жінки). На зустрічі 23 жовтня команда визначила чотири групи дорослих респондентів (мобілізовані 2024–2026; СЗЧ, які думають повернутися; ті, хто переводився чи хоче перевестися; чоловіки, які вагаються), а жінок, ухилянтів і мобілізованих через ТЦК не досліджує.", "У Trello заплановано 45 інтерв'ю (9 груп по 5), проведено 9. Зустріч 23 жовтня запропонувала мінімум 8 людей на сегмент.", "У Trello етап 2 передбачає кількісне опитування. На зустрічі 23 жовтня Даша запропонувала поки зосередитися на якісному."]};
const TABS = [
  ["overview", "Огляд"], ["stages", "Етапи"], ["segments", "Сегменти"], ["campaign", "Кампанія"]
];
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

const interviews = D.stages[2].items;
const have = interviews.reduce((a, i) => a + i.have, 0);
const need = interviews.reduce((a, i) => a + i.need, 0);

$("#lead").textContent = D.subtitle;
$("#foot").textContent = "Дані: картка Trello, остання активність " + D.meta.lastActivity + ". Відсотки й лічильники взято з картки.";

/* ---------- overview ---------- */
function overview() {
  const s = el("section");
  s.innerHTML = `
    <h2>Навіщо це дослідження</h2>
    <div class="card"><p style="margin:0">${esc(D.goal.task)}</p></div>
    <div class="split">
      <div class="card"><h3>Чому ми це робимо</h3>
        <ul class="plain">${D.goal.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul>
        <p class="label" style="margin:10px 0 0">${esc(D.goal.reason)}</p></div>
      <div class="card"><h3>Що отримаємо на виході</h3>
        <ol class="num">${D.goal.outputs.map(o => `<li>${esc(o)}</li>`).join("")}</ol></div>
    </div>
    <div id="matslot"></div>
    <h2 style="margin-top:28px">Де ми зараз</h2>
    <div class="grid">
      ${D.stages.map(st => `<div class="card"><div class="label">Етап ${st.id}</div><div class="stat">${st.percent}%</div>
        <div style="font-weight:600;margin-top:2px">${esc(st.name.split(":")[0])}</div>
        <div class="bar"><i style="width:${st.percent}%"></i></div></div>`).join("")}
      <div class="card"><div class="label">Інтерв'ю проведено</div><div class="stat">${have}<small> з ${need}</small></div>
        <div style="margin-top:2px">9 груп респондентів по 5 людей</div>
        <div class="bar warm"><i style="width:${pct(have, need)}%"></i></div></div>
    </div>
    <p class="label" style="margin-top:12px">Термін картки: ${esc(D.meta.deadline)}. Етап 3 у картці стоїть на 0%, хоча частина інтерв'ю вже зроблена.</p>
    <div class="warnbox" style="margin-top:22px"><h3>Що відрізняється від зустрічі 23 жовтня</h3>
      <ul>${D.reconcile.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>`;
  $("#matslot", s).replaceWith(materials());
  requestAnimationFrame(() => s.querySelectorAll(".bar > i").forEach(i => { const w = i.style.width; i.style.width = 0; requestAnimationFrame(() => i.style.width = w); }));
  return s;
}

/* ---------- stages ---------- */
function stages() {
  const s = el("section");
  s.innerHTML = `<h2>Етапи й задачі</h2><p class="label" style="margin:-6px 0 14px">Натисніть на етап, щоб розгорнути чи згорнути його задачі.</p>`;
  D.stages.forEach((st, idx) => {
    const box = el("div", "stage");
    const btn = el("button", "", `<div><div class="label">Етап ${st.id}</div><div class="name">${esc(st.name)}</div></div>
      <div class="pct">${st.percent}%</div><div class="bar"><i style="width:${st.percent}%"></i></div>`);
    btn.setAttribute("aria-expanded", idx === 2 ? "true" : "false");
    const body = el("div", "body");
    body.hidden = idx !== 2;
    if (st.id === 3) {
      body.innerHTML = st.items.map(i => `<div class="interview"><div>${esc(i.t)}</div><div class="count">${i.have} з ${i.need}</div>
        <div class="bar warm"><i style="width:${pct(i.have, i.need)}%"></i></div></div>`).join("");
    } else {
      body.innerHTML = st.items.map(i => `<div class="item"><div class="dot ${i.done ? "on" : ""}">${i.done ? "✓" : ""}</div>
        <div>${esc(i.t)}${i.note ? `<span class="note">${esc(i.note)}</span>` : ""}</div></div>`).join("");
    }
    btn.onclick = () => { const open = btn.getAttribute("aria-expanded") === "true"; btn.setAttribute("aria-expanded", String(!open)); body.hidden = open; };
    box.append(btn, body);
    s.append(box);
  });
  return s;
}

/* ---------- segments ---------- */
function segments() {
  const s = el("section");
  s.innerHTML = `<h2>Сегменти аудиторії</h2><p class="label" style="margin:-6px 0 14px">Шість сегментів у картці. Для кожного є таблиця з відповідями респондентів.</p>
    <div class="grid" id="seggrid"></div>
    <h3 style="margin-top:26px">Інші групи в плані інтерв'ю</h3>
    <ul class="plain" style="margin-top:8px">${D.extraInterviewGroups.map(g => `<li class="card">${esc(g)}</li>`).join("")}</ul>
    <p class="label" style="margin-top:10px">Зв'язок груп інтерв'ю із сегментами зроблено за назвами, у картці його немає.</p>`;
  const g = $("#seggrid", s);
  D.segments.forEach(sg => {
    g.append(el("div", "card seg", `<span class="id">Сегмент ${esc(sg.id)}</span><h3>${esc(sg.name)}</h3>
      <span class="label">${esc(sg.interviews)}</span><a href="${esc(sg.link)}" target="_blank" rel="noopener">Відкрити таблицю</a>`));
  });
  return s;
}

/* ---------- campaign ---------- */
function campaign() {
  const c = D.campaign;
  const s = el("section");
  s.innerHTML = `<h2>Кампанія опитування</h2>
    <div class="card"><p style="margin:0 0 8px">${esc(c.frame)}</p><p style="margin:0"><b>Ідея.</b> ${esc(c.idea)}</p></div>
    <h3 style="margin-top:22px">Шукай свою точку на карті</h3>
    <div class="route" id="route"></div><div id="point"></div>
    <p class="label">${esc(c.note)}</p>`;
  const r = $("#route", s), out = $("#point", s);
  const show = i => {
    const p = c.points[i];
    [...r.children].forEach((b, j) => b.setAttribute("aria-pressed", String(i === j)));
    out.innerHTML = `<div class="card"><span class="pill">${esc(p.who)}</span><h3 style="margin-top:10px">${esc(p.name)}</h3><p style="margin:0">${esc(p.gist)}</p></div>`;
  };
  c.points.forEach((p, i) => { const b = el("button", "", esc(p.name.split(" (")[0])); b.onclick = () => show(i); r.append(b); });
  show(0);
  const dec = el("div");
  dec.innerHTML = `<h2 style="margin-top:30px">Рішення й правки до текстів</h2>` + D.decisions.map(d =>
    `<div class="card decision" style="margin-bottom:10px"><div class="label">${esc(d.date)} · ${esc(d.who)}</div><p style="margin:4px 0 0">${esc(d.text)}</p></div>`).join("");
  s.append(dec);
  return s;
}

/* ---------- materials ---------- */
function materials() {
  const s = el("div");
  s.style.marginTop = "28px";
  const groups = ["Усі", ...new Set(D.materials.map(m => m.group))];
  s.innerHTML = `<h2>Матеріали й посилання</h2>
    <input class="search" id="q" type="search" placeholder="Шукати за назвою" aria-label="Шукати за назвою">
    <div class="chips" id="chips"></div><div id="list"></div>`;
  let g = "Усі", q = "";
  const list = $("#list", s), chips = $("#chips", s);
  const draw = () => {
    const items = D.materials.filter(m => (g === "Усі" || m.group === g) && m.name.toLowerCase().includes(q));
    list.innerHTML = items.length ? items.map(m => `<a class="mat" href="${esc(m.link)}" target="_blank" rel="noopener"><span>${esc(m.name)}<span class="note">${esc(m.group)}</span></span><span>Відкрити</span></a>`).join("")
      : `<p class="label">Нічого не знайдено. Спробуйте іншу назву чи групу.</p>`;
    [...chips.children].forEach(b => b.setAttribute("aria-pressed", String(b.textContent === g)));
  };
  groups.forEach(n => { const b = el("button", "", esc(n)); b.onclick = () => { g = n; draw(); }; chips.append(b); });
  $("#q", s).oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
  draw();
  return s;
}

const VIEWS = { overview, stages, segments, campaign, materials, history };
const main = $("#main"), tabs = $("#tabs");
function go(id, push) {
  if (!VIEWS[id]) id = "overview";
  main.replaceChildren(VIEWS[id]());
  [...tabs.children].forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === id)));
  if (push) { try { history_.replaceState(null, "", "#" + id); } catch (e) {} }
}
const history_ = window.history;
TABS.forEach(([id, label]) => {
  const b = el("button", "", label); b.dataset.id = id; b.setAttribute("role", "tab");
  b.onclick = () => { go(id, true); window.scrollTo({ top: 0 }); };
  tabs.append(b);
});
go((location.hash || "").slice(1), false);
</script>
